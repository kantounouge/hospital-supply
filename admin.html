<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品管理システム｜管理者サイト</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#fff;--primary:#1a6e3c;--primary-light:#e8f5ed;
  --accent:#e05c2a;--text:#1a2533;--text-sub:#5a6a7a;--border:#d4dce6;
  --shadow:0 2px 12px rgba(0,0,0,.08);--radius:10px;--font:'Noto Sans JP',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

/* ── トップバー ─ */
.top-bar{background:var(--primary);color:#fff;padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-bar a{color:#fff;text-decoration:none;opacity:.8;font-size:13px}.top-bar a:hover{opacity:1}
.top-bar h1{font-size:15px;font-weight:700;flex:1}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--font)}

/* ── タブナビ ─ */
.tab-nav{background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:52px;z-index:100}
.tab-nav button{
  padding:12px 18px;border:none;background:none;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text-sub);font-family:var(--font);
  border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;
  transition:color .2s;
}
.tab-nav button.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ── タブコンテンツ ─ */
.tab-content{display:none;padding:20px;max-width:1200px;margin:0 auto}
.tab-content.active{display:block}

/* ── ツールバー ─ */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--font)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--primary)}
.btn{
  padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font);transition:background .2s,opacity .2s;
}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#15592f}
.btn-secondary{background:#fff;color:var(--text);border:2px solid var(--border)}.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:#c0392b;color:#fff}.btn-danger:hover{background:#a93226}
.btn-warning{background:#e67e22;color:#fff}.btn-warning:hover{background:#ca6f1e}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-outline{background:none;border:1.5px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.flex1{flex:1}

/* ── テーブル ─ */
.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);border:1.5px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f0f4f8;padding:10px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--text-sub);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody td{padding:9px 12px;vertical-align:middle}
.empty-row{text-align:center;color:var(--text-sub);padding:32px!important;font-size:14px}

/* ── ステータスバッジ ─ */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.b-new{background:#e8f5ed;color:#1a6e3c}
.b-ordered{background:#fff8e1;color:#b8860b}
.b-done{background:#e8edf2;color:#5a6a7a}
.b-pending{background:#fff8e1;color:#b8860b}
.b-approved{background:#e8f5ed;color:#1a6e3c}
.b-rejected{background:#fff0ef;color:#c0392b}
.b-important{background:#fff0ef;color:#c0392b}
.b-normal{background:#f0f4f8;color:#5a6a7a}

/* ── カード行 ─ */
.card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--border);margin-bottom:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px}

/* ── モーダル ─ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;position:relative;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-sub)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:8px;
  font-size:14px;font-family:var(--font);transition:border-color .2s;
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* パスワード表示 */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:48px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-sub)}

/* トースト */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:#1a2533;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:#1a6e3c}
#toast.error{background:#c0392b}

/* カレンダー */
.cal-admin-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.cal-head{text-align:center;font-size:11px;font-weight:700;color:var(--text-sub);padding:6px 0}
.cal-cell{min-height:60px;border-radius:6px;padding:4px 6px;background:var(--bg);font-size:12px;position:relative}
.cal-cell.today{background:var(--primary-light)}
.cal-date{font-weight:700;font-size:12px;margin-bottom:2px}
.cal-event-chip{
  background:var(--surface);border-left:3px solid var(--primary);
  padding:2px 5px;border-radius:0 4px 4px 0;font-size:11px;margin-bottom:2px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s;
}
.cal-event-chip:hover{background:var(--primary-light)}
.cal-event-chip.type-deadline{border-color:#e05c2a}
.cal-event-chip.type-delivery{border-color:#2d6fa3}
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav button{background:none;border:1.5px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--text)}
.cal-nav button:hover{background:var(--primary-light)}
.cal-month{font-size:14px;font-weight:700;min-width:80px;text-align:center}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-bar">
  <a href="portal.html">← ポータル</a>
  <h1>⚙️ 管理者サイト｜総務課</h1>
  <button class="btn-logout" id="logout-btn">ログアウト</button>
</div>

<!-- タブナビ -->
<div class="tab-nav" id="tab-nav">
  <button class="tab-nav-btn active" data-tab="orders">📦 注文管理</button>
  <button class="tab-nav-btn" data-tab="products">📋 商品マスタ</button>
  <button class="tab-nav-btn" data-tab="depts">🏥 部署管理</button>
  <button class="tab-nav-btn" data-tab="notices">📢 お知らせ</button>
  <button class="tab-nav-btn" data-tab="calendar">📅 カレンダー</button>
  <button class="tab-nav-btn" data-tab="vendors">🏢 業者リスト</button>
  <button class="tab-nav-btn" data-tab="requests">🔍 商品登録依頼</button>
</div>

<!-- ① 注文管理 -->
<div class="tab-content active" id="tab-orders">
  <div class="toolbar">
    <input type="text" id="o-dept-filter" placeholder="部署名で絞り込み" style="width:150px">
    <select id="o-status-filter">
      <option value="">全ステータス</option>
      <option value="受付済">受付済</option>
      <option value="発注済">発注済</option>
      <option value="払い出し済">払い出し済</option>
    </select>
    <input type="date" id="o-date-from"><span style="color:#999">〜</span><input type="date" id="o-date-to">
    <button class="btn btn-secondary" id="o-toggle-done">👁 払い出し済を表示</button>
    <button class="btn btn-primary" id="o-refresh">🔄 更新</button>
    <button class="btn btn-secondary" id="o-export-inv">📊 棚卸しCSV（倉庫）</button>
  </div>
  <!-- 一括操作 -->
  <div class="card" style="padding:12px 16px;margin-bottom:12px;display:flex;gap:10px;align-items:center">
    <span style="font-size:13px;color:var(--text-sub)">選択した注文を一括変更：</span>
    <button class="btn btn-sm btn-warning" id="o-bulk-ordered">発注済にする</button>
    <button class="btn btn-sm btn-primary" id="o-bulk-done">払い出し済にする</button>
    <span id="o-selected-count" style="font-size:12px;color:var(--text-sub);margin-left:8px">0件選択中</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="o-check-all"></th>
          <th>注文ID</th><th>注文日時</th><th>部署</th><th>商品</th><th>数量</th><th>金額</th><th>注文先</th><th>ステータス</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="orders-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ② 商品マスタ -->
<div class="tab-content" id="tab-products">
  <div class="toolbar">
    <input type="text" id="p-search" placeholder="品名・型番・規格・種別など" class="flex1" style="min-width:200px">
    <select id="p-cat-filter"><option value="">全種別</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="p-show-inactive"> 廃番含む
    </label>
    <button class="btn btn-primary" id="p-add-btn">＋ 新規登録</button>
    <button class="btn btn-secondary" id="p-export-btn">📥 CSVエクスポート</button>
    <label class="btn btn-secondary" style="cursor:pointer">
      📤 CSVインポート<input type="file" id="p-import-file" accept=".csv" style="display:none">
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>コード</th><th>種別</th><th>品名</th><th>型番</th><th>規格</th><th>単位</th><th>金額</th><th>注文先</th><th>在庫</th><th>有効</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="products-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ③ 部署管理 -->
<div class="tab-content" id="tab-depts">
  <div class="toolbar">
    <button class="btn btn-primary" id="dept-add-btn">＋ 部署追加</button>
    <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="dept-show-inactive"> 無効含む
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>部署ID</th><th>部署名</th><th>ログインID</th><th>メール</th><th>有効</th><th>操作</th></tr></thead>
      <tbody id="depts-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ④ お知らせ -->
<div class="tab-content" id="tab-notices">
  <div class="toolbar">
    <button class="btn btn-primary" id="notice-add-btn">＋ 新規作成</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>掲載日</th><th>タイトル</th><th>重要度</th><th>有効</th><th>操作</th></tr></thead>
      <tbody id="notices-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ⑤ カレンダー -->
<div class="tab-content" id="tab-calendar">
  <div class="toolbar">
    <div class="cal-nav">
      <button id="cal-prev">‹</button>
      <span class="cal-month" id="cal-month-lbl"></span>
      <button id="cal-next">›</button>
    </div>
    <button class="btn btn-primary" id="cal-add-btn">＋ 予定追加</button>
  </div>
  <div class="cal-admin-grid" id="cal-admin-grid"></div>
</div>

<!-- ⑥ 業者リスト -->
<div class="tab-content" id="tab-vendors">
  <div class="toolbar">
    <button class="btn btn-primary" id="vendor-add-btn">＋ 業者追加</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>業者名</th><th>担当者</th><th>電話</th><th>メール</th><th>サイト</th><th>操作</th></tr></thead>
      <tbody id="vendors-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ⑦ 商品登録依頼 -->
<div class="tab-content" id="tab-requests">
  <div class="toolbar">
    <select id="req-status-filter">
      <option value="">全て</option>
      <option value="受付中">受付中</option>
      <option value="承認">承認</option>
      <option value="却下">却下</option>
    </select>
    <button class="btn btn-primary" id="req-refresh">🔄 更新</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>受付ID</th><th>受付日</th><th>部署</th><th>商品名</th><th>型番</th><th>URL</th><th>状態</th><th>操作</th></tr></thead>
      <tbody id="requests-tbody"></tbody>
    </table>
  </div>
</div>

<!-- モーダル（汎用） -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoRS-BS7B8ed2I9fOykpogsPhNvkmCDLnb5p4_VWjBC7qhTx0WMdzNhX6WXucVEA5j/exec'; // ★要変更

async function gasGet(p){
  const qs=Object.entries(p).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v??'')).join('&');
  const res=await fetch(GAS_URL+'?'+qs,{redirect:'follow'});
  const text=await res.text();
  try{return JSON.parse(text);}catch{return{ok:false,error:'サーバーエラー（JSONパース失敗）'};}
}
function getSession(){try{return JSON.parse(sessionStorage.getItem('hms_session')||'null');}catch{return null;}}
function setSession(s){sessionStorage.setItem('hms_session',JSON.stringify(s));}
function clearSession(){sessionStorage.removeItem('hms_session');}
function showToast(msg,type='',dur=2800){
  const el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'');
  setTimeout(()=>el.className='',dur);
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return '¥'+Number(n||0).toLocaleString();}

// セッションチェック
const session=getSession();
if(!session||session.role!=='admin'){location.href='portal.html';}

// ── タブ切り替え ─────────────────────────────────────────────
const tabContents={'orders':()=>loadOrders(),'products':()=>loadProducts(),'depts':()=>loadDepts(),
  'notices':()=>loadNotices(),'calendar':()=>loadCalendarAdmin(),'vendors':()=>loadVendors(),'requests':()=>loadRequests()};

document.querySelectorAll('.tab-nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const tab=btn.dataset.tab;
    document.querySelectorAll('.tab-nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    if(tabContents[tab])tabContents[tab]();
  });
});

// ── モーダル ─────────────────────────────────────────────────
function openModal(title,html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

// ══════════════════════════════════════════════════════════════
//  ① 注文管理
// ══════════════════════════════════════════════════════════════
let showDone=false, ordersData=[];

async function loadOrders(){
  const deptFilter=document.getElementById('o-dept-filter').value.trim();
  const status=document.getElementById('o-status-filter').value;
  const from=document.getElementById('o-date-from').value;
  const to  =document.getElementById('o-date-to').value;
  const res=await gasGet({action:'getAllOrders',token:session.token,
    includeComplete:showDone?'true':'false',status,startDate:from,endDate:to});
  if(!res.ok){showToast('取得失敗','error');return;}
  ordersData=res.data.filter(o=>!deptFilter||o.deptName.includes(deptFilter));
  renderOrders();
}

function renderOrders(){
  const tbody=document.getElementById('orders-tbody');
  if(!ordersData.length){tbody.innerHTML='<tr><td colspan="10" class="empty-row">注文がありません</td></tr>';return;}
  // 注文ID単位でグループ
  const byId={};
  ordersData.forEach(o=>{if(!byId[o.orderId])byId[o.orderId]=[];byId[o.orderId].push(o);});
  tbody.innerHTML=Object.entries(byId).map(([id,items])=>`
    <tr>
      <td><input type="checkbox" class="o-chk" data-id="${id}"></td>
      <td><a href="order-detail.html?orderId=${encodeURIComponent(id)}" style="color:var(--primary);font-weight:600;font-family:monospace;font-size:12px">${escHtml(id)}</a></td>
      <td style="font-size:12px;white-space:nowrap">${escHtml(items[0].orderedAt?.slice(0,10)||'-')}</td>
      <td>${escHtml(items[0].deptName)}</td>
      <td><div style="max-width:200px">${items.map(i=>`<div style="font-size:12px">${escHtml(i.name)} ×${i.qty}</div>`).join('')}</div></td>
      <td style="text-align:center">${items.reduce((s,i)=>s+i.qty,0)}</td>
      <td style="white-space:nowrap">${fmt(items.reduce((s,i)=>s+(i.price||0)*i.qty,0))}</td>
      <td style="font-size:12px">${[...new Set(items.map(i=>i.vendor).filter(Boolean))].join('<br>')}</td>
      <td><span class="badge ${statusBadge(items[0].status)}">${items[0].status}</span></td>
      <td style="white-space:nowrap">
        <a class="btn btn-sm btn-outline" href="order-detail.html?orderId=${encodeURIComponent(id)}">詳細</a>
      </td>
    </tr>`).join('');

  // チェックボックス
  document.getElementById('o-check-all').addEventListener('change',function(){
    document.querySelectorAll('.o-chk').forEach(c=>c.checked=this.checked);
    updateSelCount();
  });
  document.querySelectorAll('.o-chk').forEach(c=>c.addEventListener('change',updateSelCount));
}

function updateSelCount(){
  const n=document.querySelectorAll('.o-chk:checked').length;
  document.getElementById('o-selected-count').textContent=n+'件選択中';
}

function statusBadge(s){return s==='払い出し済'?'b-done':s==='発注済'?'b-ordered':'b-new';}

async function bulkStatus(newStatus){
  const ids=[...document.querySelectorAll('.o-chk:checked')].map(c=>c.dataset.id);
  if(!ids.length){showToast('注文を選択してください','error');return;}
  if(!confirm(`選択した${ids.length}件を「${newStatus}」に変更しますか？`))return;
  const res=await gasGet({action:'bulkUpdateStatus',token:session.token,orderIds:JSON.stringify(ids),status:newStatus});
  if(res.ok){showToast(`${ids.length}件を${newStatus}に変更しました`,'success');loadOrders();}
  else showToast('変更失敗: '+res.error,'error');
}

document.getElementById('o-bulk-ordered').addEventListener('click',()=>bulkStatus('発注済'));
document.getElementById('o-bulk-done').addEventListener('click',()=>bulkStatus('払い出し済'));
document.getElementById('o-refresh').addEventListener('click',loadOrders);
document.getElementById('o-toggle-done').addEventListener('click',function(){
  showDone=!showDone;this.textContent=showDone?'👁 払い出し済を非表示':'👁 払い出し済を表示';loadOrders();
});
document.getElementById('o-export-inv').addEventListener('click',async()=>{
  const res=await gasGet({action:'exportInventoryCSV',token:session.token,type:'warehouse'});

let productsData=[];
async function loadProducts(){
  const inc=document.getElementById('p-show-inactive').checked;
  const res=await gasGet({action:'getProducts',token:session.token,includeInactive:inc?'true':'false'});
  productsData=res.ok?res.data:[];
  // 種別フィルタ
  const cats=[...new Set(productsData.map(p=>p.category).filter(Boolean))].sort();
  const sel=document.getElementById('p-cat-filter');
  sel.innerHTML='<option value="">全種別</option>'+cats.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  renderProducts();
}
function renderProducts(){
  const kw=document.getElementById('p-search').value.trim().toLowerCase();
  const cat=document.getElementById('p-cat-filter').value;
  const filtered=productsData.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(kw){const hay=[p.name,p.model,p.spec,p.category,p.vendor,p.location,p.note].join(' ').toLowerCase();return hay.includes(kw);}
    return true;
  });
  const tbody=document.getElementById('products-tbody');
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="11" class="empty-row">商品がありません</td></tr>';return;}
  tbody.innerHTML=filtered.map(p=>`
    <tr style="${p.isActive?'':'opacity:.5'}">
      <td style="font-family:monospace;font-size:12px">${escHtml(p.code)}</td>
      <td>${escHtml(p.category||'-')}</td>
      <td><div style="font-weight:600">${escHtml(p.name)}</div></td>
      <td style="font-size:12px">${escHtml(p.model||'-')}</td>
      <td style="font-size:12px">${escHtml(p.spec||'-')}</td>
      <td>${escHtml(p.unit||'-')}</td>
      <td style="white-space:nowrap">${p.price?fmt(p.price):'-'}</td>
      <td style="font-size:12px">${escHtml(p.vendor||'-')}</td>
      <td style="text-align:center">${p.stockManaged?'✔':'-'}</td>
      <td><span class="badge ${p.isActive?'b-approved':'b-rejected'}">${p.isActive?'有効':'廃番'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm btn-secondary p-edit" data-code="${p.code}">編集</button>
        ${p.isActive?`<button class="btn btn-sm btn-danger p-disc" data-code="${p.code}">廃番</button>`:''}
      </td>
    </tr>`).join('');

  tbody.querySelectorAll('.p-edit').forEach(btn=>{
    btn.addEventListener('click',()=>openProductModal(productsData.find(p=>p.code===btn.dataset.code)));
  });
  tbody.querySelectorAll('.p-disc').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('廃番にしますか？'))return;
      const res=await gasGet({action:'discontinueProduct',token:session.token,code:btn.dataset.code});
      if(res.ok){showToast('廃番にしました','success');loadProducts();}
    });
  });
}

document.getElementById('p-import-file').addEventListener('change',async function(){
  if(!this.files[0])return;
  const text=await this.files[0].text();
  const lines=text.split('\n').filter(l=>l.trim()&&!l.startsWith('商品コード'));
  if(!lines.length){showToast('データがありません','error');return;}
  let ok=0;
  for(const line of lines){
    const v=_parseCsv(line);
    const params={code:v[0],category:v[1],name:v[2],model:v[3],spec:v[4],quantity:v[5],unit:v[6],price:v[7],vendor:v[8],orderUnit:v[9],stockManaged:v[10]==='TRUE',stockMin:v[11],location:v[12],link1:v[13],link2:v[14],note:v[15]};
    const res=await gasGet({action:'importProductRow',token:session.token,...params});
    if(res.ok)ok++;
  }
  showToast(`${ok}件インポートしました`,'success');
  loadProducts();
  this.value='';
});

let calYear=new Date().getFullYear(),calMonth=new Date().getMonth()+1,calEvents=[];

async function loadCalendarAdmin(){
  const res=await gasGet({action:'getCalendar',year:calYear,month:calMonth});
  calEvents=res.ok?res.data:[];
  renderCalAdmin();
}

function renderCalAdmin(){
  document.getElementById('cal-month-lbl').textContent=`${calYear}/${String(calMonth).padStart(2,'0')}`;
  const grid=document.getElementById('cal-admin-grid');
  const days=['日','月','火','水','木','金','土'];
  const today=new Date();today.setHours(0,0,0,0);
  const typeClass={deadline:'type-deadline',delivery:'type-delivery',other:''};
  const typeIcon={deadline:'⚠️',delivery:'📦',other:'📅'};

  let html=days.map(d=>`<div class="cal-head">${d}</div>`).join('');
  const first=new Date(calYear,calMonth-1,1);
  const lastDay=new Date(calYear,calMonth,0).getDate();
  const startDow=first.getDay();

  for(let i=0;i<startDow;i++)html+=`<div class="cal-cell" style="background:none"></div>`;

  for(let d=1;d<=lastDay;d++){
    const dt=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=calEvents.filter(e=>e.date===dt);
    const isToday=new Date(calYear,calMonth-1,d).getTime()===today.getTime();
    const chips=evs.map(e=>`<div class="cal-event-chip ${typeClass[e.type]||''}" title="${escHtml(e.title)}" onclick="editCalEvent('${e.id}')">${typeIcon[e.type]||'📅'} ${escHtml(e.title.slice(0,10))}</div>`).join('');
    html+=`<div class="cal-cell${isToday?' today':''}">
      <div class="cal-date">${d}</div>${chips}
      <div style="font-size:10px;color:var(--primary);cursor:pointer;margin-top:2px" onclick="openCalAddModal('${dt}')">＋</div>
    </div>`;
  }
  grid.innerHTML=html;
}

  openModal('予定追加',`

      <div class="form-group"><label>日付</label><input type="date" id="cm-date" value="${date||''}"></div>

        <select id="cm-type"><option value="deadline">⚠️ 発注締め切り</option><option value="delivery">📦 払い出し日</option><option value="other">📅 その他</option></select>

    </div>
    <div class="form-group"><label>タイトル *</label><input id="cm-title"></div>
    <div class="form-group"><label>備考</label><textarea id="cm-note" style="min-height:60px"></textarea></div>

      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>

  document.getElementById('cm-save').addEventListener('click',async()=>{

  openModal('予定編集',`

    <div class="form-group"><label>備考</label><textarea id="cm-note" style="min-height:60px">${escHtml(ev.note||'')}</textarea></div>

      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>

    </div>`);
  document.getElementById('cm-save').addEventListener('click',async()=>{
    const title=document.getElementById('cm-title').value.trim();
    const res=await gasGet({action:'updateCalendarEvent',token:session.token,id,date:document.getElementById('cm-date').value,title,type:document.getElementById('cm-type').value,note:document.getElementById('cm-note').value});

document.getElementById('cal-add-btn').addEventListener('click',()=>openCalAddModal(''));
document.getElementById('cal-prev').addEventListener('click',()=>{
  if(calMonth===1){calMonth=12;calYear--;}else calMonth--;
  loadCalendarAdmin();
});
document.getElementById('cal-next').addEventListener('click',()=>{
  if(calMonth===12){calMonth=1;calYear++;}else calMonth++;
  loadCalendarAdmin();
});

      <td>${v.url?`<a href="${v.url}" target="_blank" class="btn btn-sm btn-outline">🔗 開く</a>`:'-'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm btn-secondary v-edit" data-id="${v.id}">編集</button>
        <button class="btn btn-sm btn-danger v-del" data-id="${v.id}">削除</button>
      </td>
    </tr>`).join('');
  tbody.querySelectorAll('.v-edit').forEach(btn=>{
    const v=vendors.find(x=>x.id===btn.dataset.id);
    btn.addEventListener('click',()=>openVendorModal(v));
  });
  tbody.querySelectorAll('.v-del').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(!confirm('削除しますか？'))return;
      const res=await gasGet({action:'deleteVendor',token:session.token,id:btn.dataset.id});
      if(res.ok){showToast('削除しました','success');loadVendors();}
    });
  });
}

document.getElementById('vendor-add-btn').addEventListener('click',()=>openVendorModal(null));

function openVendorModal(v){
  const isNew=!v;
  openModal(isNew?'業者追加':'業者編集',`
    <div class="form-row">
      <div class="form-group"><label>業者名 *</label><input id="vm-name" value="${escHtml(v?.name||'')}"></div>
      <div class="form-group"><label>担当者</label><input id="vm-contact" value="${escHtml(v?.contact||'')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>電話番号</label><input id="vm-phone" value="${escHtml(v?.phone||'')}"></div>
      <div class="form-group"><label>メール</label><input type="email" id="vm-email" value="${escHtml(v?.email||'')}"></div>
    </div>
    <div class="form-group"><label>発注サイトURL</label><input id="vm-url" value="${escHtml(v?.url||'')}"></div>
    <div class="form-row">
      <div class="form-group"><label>ログインID</label><input id="vm-loginid" value="${escHtml(v?.loginId||'')}"></div>
      <div class="form-group"><label>パスワード</label>
        <div class="pw-wrap"><input type="password" id="vm-pass" value="${escHtml(v?.password||'')}">
        <button type="button" class="pw-toggle" onclick="togglePw('vm-pass',this)">👁</button></div>
      </div>
    </div>
    <div class="form-group"><label>備考</label><textarea id="vm-note">${escHtml(v?.note||'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="vm-save">保存</button>
    </div>`);
  document.getElementById('vm-save').addEventListener('click',async()=>{
    const name=document.getElementById('vm-name').value.trim();
    if(!name){showToast('業者名を入力してください','error');return;}
    const params={name,contact:document.getElementById('vm-contact').value.trim(),phone:document.getElementById('vm-phone').value.trim(),email:document.getElementById('vm-email').value.trim(),url:document.getElementById('vm-url').value.trim(),loginId:document.getElementById('vm-loginid').value.trim(),password:document.getElementById('vm-pass').value,note:document.getElementById('vm-note').value.trim()};
    const action=isNew?'addVendor':'updateVendor';
    if(!isNew)params.id=v.id;
    const res=await gasGet({action,token:session.token,...params});
    if(res.ok){showToast('保存しました','success');closeModal();loadVendors();}
    else showToast('保存失敗','error');
  });
}

// ══════════════════════════════════════════════════════════════
//  ⑦ 商品登録依頼
// ══════════════════════════════════════════════════════════════
async function loadRequests(){
  const status=document.getElementById('req-status-filter').value;
  const res=await gasGet({action:'getProductRequests',token:session.token,status});
  const reqs=res.ok?res.data:[];
  const tbody=document.getElementById('requests-tbody');
  if(!reqs.length){tbody.innerHTML='<tr><td colspan="8" class="empty-row">依頼がありません</td></tr>';return;}
  const statusCls={受付中:'b-pending',承認:'b-approved',却下:'b-rejected'};
  tbody.innerHTML=reqs.slice().reverse().map(r=>`
    <tr>
      <td style="font-family:monospace;font-size:12px">${escHtml(r.reqId)}</td>
      <td style="font-size:12px;white-space:nowrap">${escHtml(r.createdAt?.slice(0,10)||'-')}</td>
      <td>${escHtml(r.deptName)}</td>
      <td><strong>${escHtml(r.name)}</strong></td>
      <td style="font-size:12px">${escHtml(r.model||'-')}</td>
      <td>${r.url?`<a href="${r.url}" target="_blank" class="btn btn-sm btn-outline">🔗</a>`:'-'}</td>
      <td><span class="badge ${statusCls[r.status]||''}">${r.status}</span></td>
      <td>${r.status==='受付中'?`<button class="btn btn-sm btn-primary req-proc" data-id="${r.reqId}">審査</button>`:escHtml(r.adminNote||'-')}</td>
    </tr>`).join('');
  tbody.querySelectorAll('.req-proc').forEach(btn=>{
    const req=reqs.find(x=>x.reqId===btn.dataset.id);
    btn.addEventListener('click',()=>openRequestModal(req));
  });
}

document.getElementById('req-refresh').addEventListener('click',loadRequests);
document.getElementById('req-status-filter').addEventListener('change',loadRequests);

function openRequestModal(req){
  openModal('商品登録依頼の審査',`
    <div style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px">
      <div style="margin-bottom:6px"><strong>部署：</strong>${escHtml(req.deptName)}</div>
      <div style="margin-bottom:6px"><strong>商品名：</strong>${escHtml(req.name)}</div>
      <div style="margin-bottom:6px"><strong>型番：</strong>${escHtml(req.model||'-')}</div>
      ${req.url?`<div style="margin-bottom:6px"><strong>URL：</strong><a href="${req.url}" target="_blank" style="color:var(--primary)">${escHtml(req.url)}</a></div>`:''}
      <div><strong>備考：</strong>${escHtml(req.note||'-')}</div>
    </div>
    <div class="form-group"><label>審査コメント（任意）</label><textarea id="req-note" placeholder="承認・却下の理由など"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-danger" id="req-reject">却下</button>
      <button class="btn btn-primary" id="req-approve">承認</button>
    </div>`);

  async function decide(approved){
    const adminNote=document.getElementById('req-note').value.trim();
    const res=await gasGet({action:'processProductRequest',token:session.token,reqId:req.reqId,approved:approved?'true':'false',adminNote});
    if(res.ok){showToast(approved?'承認しました':'却下しました','success');closeModal();loadRequests();}
    else showToast('処理失敗','error');
  }
  document.getElementById('req-approve').addEventListener('click',()=>decide(true));
  document.getElementById('req-reject').addEventListener('click',()=>decide(false));
}

// ── 共通ユーティリティ ───────────────────────────────────────
function togglePw(id,btn){
  const inp=document.getElementById(id);
  inp.type=inp.type==='password'?'text':'password';
  btn.textContent=inp.type==='password'?'👁':'🙈';
}

function _downloadCsv(csv,filename){
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

function _parseCsv(line){
  const r=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')inQ=!inQ;
    else if(line[i]===','&&!inQ){r.push(cur);cur='';}
    else cur+=line[i];
  }
  r.push(cur);
  return r.map(s=>s.replace(/^"|"$/g,''));
}

  await gasGet({action:'logout',token:session.token}).catch(()=>{});
