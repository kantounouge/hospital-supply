<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品請求伝票</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#fff;--primary:#1a6e3c;--primary-light:#e8f5ed;
  --accent:#e05c2a;--text:#1a2533;--text-sub:#5a6a7a;--border:#d4dce6;
  --shadow:0 2px 12px rgba(0,0,0,.08);--radius:10px;--font:'Noto Sans JP',sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.top-bar{background:var(--primary);color:#fff;padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-bar a{color:#fff;text-decoration:none;opacity:.8;font-size:13px}
.top-bar a:hover{opacity:1}
.top-bar h1{font-size:15px;font-weight:700;flex:1}
.top-bar .cart-btn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;
  font-family:var(--font);position:relative;transition:background .2s;
}
.top-bar .cart-btn:hover{background:rgba(255,255,255,.25)}
.cart-badge{
  position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

.layout{display:grid;grid-template-columns:1fr 380px;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* ── 左：検索エリア ─ */
.search-panel{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--border)}
.tab-row{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:0}
.tab{
  padding:8px 16px;border-radius:6px 6px 0 0;border:none;background:none;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--text-sub);
  font-family:var(--font);border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .2s;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{
  flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:8px;
  font-size:14px;font-family:var(--font);transition:border-color .2s;
}
.search-bar input:focus{outline:none;border-color:var(--primary)}
.search-bar select{
  padding:10px 12px;border:2px solid var(--border);border-radius:8px;
  font-size:13px;font-family:var(--font);background:#fff;cursor:pointer;
}
.search-bar button{
  padding:10px 18px;background:var(--primary);color:#fff;border:none;
  border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font);
  font-weight:600;transition:background .2s;white-space:nowrap;
}
.search-bar button:hover{background:#15592f}

/* 商品テーブル */
.product-table-wrap{overflow-x:auto;max-height:calc(100vh - 260px);overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  position:sticky;top:0;background:#f0f4f8;font-size:12px;font-weight:700;
  color:var(--text-sub);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border);
  white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--primary-light)}
tbody td{padding:8px 10px;vertical-align:middle}
.btn-add{
  padding:5px 12px;background:var(--primary);color:#fff;border:none;
  border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:var(--font);white-space:nowrap;transition:background .2s;
}
.btn-add:hover{background:#15592f}
.btn-add.added{background:#5a6a7a;cursor:default}
.link-btn{color:var(--primary);font-size:12px;text-decoration:none}
.link-btn:hover{text-decoration:underline}
.empty-row{text-align:center;color:var(--text-sub);padding:32px;font-size:14px}
.loading-row{text-align:center;color:var(--text-sub);padding:32px}
.loading-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 右：カート ─ */
.cart-panel{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--border);position:sticky;top:72px;max-height:calc(100vh - 90px);overflow-y:auto}
.cart-panel h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cart-empty{color:var(--text-sub);font-size:13px;text-align:center;padding:20px 0}
.cart-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.cart-item:last-of-type{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-sub{font-size:11px;color:var(--text-sub);margin-top:2px}
.qty-ctrl{display:flex;align-items:center;gap:4px;margin-top:6px}
.qty-ctrl button{
  width:24px;height:24px;border:1.5px solid var(--border);border-radius:4px;
  background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.qty-ctrl button:hover{background:var(--primary-light)}
.qty-ctrl input{
  width:44px;height:24px;border:1.5px solid var(--border);border-radius:4px;
  text-align:center;font-size:13px;font-family:var(--font);
}
.qty-ctrl input:focus{outline:none;border-color:var(--primary)}
.btn-remove{background:none;border:none;cursor:pointer;color:#aaa;font-size:18px;padding:0;line-height:1;transition:color .15s;flex-shrink:0;margin-top:2px}
.btn-remove:hover{color:var(--accent)}

.cart-total{
  background:var(--primary-light);border-radius:8px;padding:12px 14px;
  margin:14px 0;display:flex;justify-content:space-between;align-items:center;
}
.cart-total-label{font-size:13px;color:var(--text-sub)}
.cart-total-amount{font-size:18px;font-weight:700;color:var(--primary)}

.note-area{margin-bottom:14px}
.note-area label{font-size:12px;font-weight:600;color:var(--text-sub);display:block;margin-bottom:4px}
.note-area textarea{
  width:100%;padding:8px 12px;border:2px solid var(--border);border-radius:8px;
  font-size:13px;font-family:var(--font);resize:vertical;min-height:60px;
  transition:border-color .2s;
}
.note-area textarea:focus{outline:none;border-color:var(--primary)}

.btn-submit{
  width:100%;padding:14px;background:var(--primary);color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--font);transition:background .2s;
}
.btn-submit:hover{background:#15592f}
.btn-submit:disabled{background:#aaa;cursor:not-allowed}
.btn-clear{
  width:100%;padding:8px;background:none;border:1.5px solid var(--border);
  border-radius:8px;font-size:12px;color:var(--text-sub);cursor:pointer;
  font-family:var(--font);margin-top:8px;transition:background .2s;
}
.btn-clear:hover{background:#f0f4f8}

/* トースト */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:#1a2533;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:#1a6e3c}
#toast.error{background:#c0392b}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-bar">
  <a href="portal.html">← ポータル</a>
  <h1>📋 物品請求伝票</h1>
  <button class="cart-btn" id="cart-scroll-btn">
    🛒 カート <span class="cart-badge" id="cart-badge">0</span>
  </button>
</div>

<div class="layout">
  <!-- 左：商品検索 -->
  <div class="search-panel">
    <div class="tab-row">
      <button class="tab active" data-tab="search">🔍 商品検索</button>
      <button class="tab" data-tab="frequent">⭐ よく頼む商品</button>
    </div>

    <div id="tab-search">
      <div class="search-bar">
        <input type="text" id="kw" placeholder="品名・型番・規格・種別 など（スペース区切りAND）" />
        <select id="cat-filter">
          <option value="">全種別</option>
        </select>
        <button id="search-btn">検索</button>
      </div>
    </div>
    <div id="tab-frequent" style="display:none">
      <p style="font-size:12px;color:#5a6a7a;margin-bottom:12px">2回以上注文したことがある商品を表示しています。</p>
    </div>

    <div class="product-table-wrap">
      <table>
        <thead>
          <tr>
            <th>品名</th><th>種別</th><th>金額</th><th>単位</th><th>入数</th><th>詳細</th><th>追加</th>
          </tr>
        </thead>
        <tbody id="product-tbody">
          <tr><td colspan="7" class="loading-row"><span class="loading-spinner"></span>読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 右：カート -->
  <div class="cart-panel" id="cart-panel">
    <h2>🛒 カート</h2>
    <div id="cart-items-area"></div>
    <div class="cart-total">
      <span class="cart-total-label">合計金額（参考）</span>
      <span class="cart-total-amount" id="cart-total">¥0</span>
    </div>
    <div class="note-area">
      <label>備考・依頼事項</label>
      <textarea id="order-note" placeholder="配送先・特記事項など"></textarea>
    </div>
    <button class="btn-submit" id="submit-btn" disabled>📤 注文を送信する</button>
    <button class="btn-clear" id="clear-btn">🗑 カートをクリア</button>
  </div>
</div>

<div id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoRS-BS7B8ed2I9fOykpogsPhNvkmCDLnb5p4_VWjBC7qhTx0WMdzNhX6WXucVEA5j/exec'; // ★要変更

// ── 共通 ──────────────────────────────────────────────────────
async function gasGet(params){
  const qs=Object.entries(params).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v??'')).join('&');
  const res=await fetch(GAS_URL+'?'+qs,{redirect:'follow'});
  const text=await res.text();
  try{return JSON.parse(text);}catch{return{ok:false,error:'サーバーエラー（JSONパース失敗）'};}
}
function getSession(){try{return JSON.parse(sessionStorage.getItem('hms_session')||'null');}catch{return null;}}
function showToast(msg,type='',dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type||'');
  setTimeout(()=>el.className='',dur);
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return '¥'+Number(n||0).toLocaleString();}

// ── セッションチェック ────────────────────────────────────────
const session = getSession();
if(!session){location.href='portal.html';}

// ── カート（sessionStorage）─────────────────────────────────
const CART_KEY='hms_cart';
function loadCart(){try{return JSON.parse(sessionStorage.getItem(CART_KEY)||'[]');}catch{return[];}}
function saveCart(cart){sessionStorage.setItem(CART_KEY,JSON.stringify(cart));}
function clearCart(){sessionStorage.removeItem(CART_KEY);}

// ── 商品データ ───────────────────────────────────────────────
let allProducts=[], currentTab='search';

async function fetchProducts(){
  const res=await gasGet({action:'searchProducts',token:session.token,keyword:'',category:''});
  allProducts=res.ok?res.data:[];
  // 種別フィルタ選択肢
  const cats=[...new Set(allProducts.map(p=>p.category).filter(Boolean))].sort();
  const sel=document.getElementById('cat-filter');
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
  renderProducts(allProducts);
}

async function searchProducts(){
  const kw=document.getElementById('kw').value.trim();
  const cat=kw?'':document.getElementById('cat-filter').value;
  const res=await gasGet({action:'searchProducts',token:session.token,keyword:kw,category:cat});
  renderProducts(res.ok?res.data:[]);
}

async function loadFrequent(){
  const res=await gasGet({action:'getFrequentProducts',token:session.token});
  renderProducts(res.ok?res.data:[]);
}

function renderProducts(products){
  const cart=loadCart();
  const cartCodes=new Set(cart.map(i=>i.code));
  const tbody=document.getElementById('product-tbody');
  if(!products.length){tbody.innerHTML='<tr><td colspan="7" class="empty-row">該当する商品がありません</td></tr>';return;}
  tbody.innerHTML=products.map(p=>`
    <tr data-code="${p.code}">
      <td><div style="font-weight:600;line-height:1.3">${escHtml(p.name)}</div>
          <div style="font-size:11px;color:#5a6a7a">${escHtml(p.model||'')}${p.spec?' / '+escHtml(p.spec):''}</div></td>
      <td>${escHtml(p.category||'-')}</td>
      <td style="white-space:nowrap">${p.price?fmt(p.price):'-'}</td>
      <td>${escHtml(p.unit||'-')}</td>
      <td>${escHtml(String(p.quantity||'-'))}</td>
      <td>${p.link1?`<a class="link-btn" href="${p.link1}" target="_blank">🔗</a>`:'-'}</td>
      <td><button class="btn-add${cartCodes.has(p.code)?' added':''}" data-code="${p.code}">
        ${cartCodes.has(p.code)?'追加済':'＋追加'}
      </button></td>
    </tr>`).join('');

  tbody.querySelectorAll('.btn-add:not(.added)').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const code=btn.dataset.code;
      const p=products.find(x=>x.code===code);
      if(!p)return;
      const cart=loadCart();
      if(cart.find(i=>i.code===code)){showToast('すでにカートにあります');return;}
      cart.push({code:p.code,name:p.name,model:p.model,spec:p.spec,unit:p.unit,qty:1,price:p.price,vendor:p.vendor,link1:p.link1,note:''});
      saveCart(cart);
      renderCart();
      btn.textContent='追加済';btn.classList.add('added');
      showToast(p.name+' をカートに追加しました','success');
    });
  });
}

// ── タブ切り替え ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    currentTab=tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-search').style.display=currentTab==='search'?'':'none';
    document.getElementById('tab-frequent').style.display=currentTab==='frequent'?'':'none';
    if(currentTab==='frequent')loadFrequent();
    else renderProducts(allProducts);
  });
});

document.getElementById('search-btn').addEventListener('click',searchProducts);
document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')searchProducts();});
// リアルタイム検索（種別フィルタ変更時）
document.getElementById('cat-filter').addEventListener('change',searchProducts);

// ── カート描画 ───────────────────────────────────────────────
function renderCart(){
  const cart=loadCart();
  const area=document.getElementById('cart-items-area');
  const badge=document.getElementById('cart-badge');
  badge.textContent=cart.length;

  if(!cart.length){
    area.innerHTML='<div class="cart-empty">カートは空です</div>';
    document.getElementById('cart-total').textContent='¥0';
    document.getElementById('submit-btn').disabled=true;
    return;
  }
  document.getElementById('submit-btn').disabled=false;

  area.innerHTML=cart.map((item,idx)=>`
    <div class="cart-item" data-idx="${idx}">
      <div class="cart-item-info">
        <div class="cart-item-name">${escHtml(item.name)}</div>
        <div class="cart-item-sub">${escHtml(item.model||'')}${item.spec?' / '+escHtml(item.spec):''} / ${escHtml(item.unit||'-')}</div>
        <div class="qty-ctrl">
          <button class="qty-minus" data-idx="${idx}">−</button>
          <input type="number" class="qty-input" data-idx="${idx}" value="${item.qty}" min="1" max="999">
          <button class="qty-plus" data-idx="${idx}">＋</button>
          <span style="font-size:12px;color:#5a6a7a;margin-left:4px">${item.price?fmt(item.price*item.qty):''}</span>
        </div>
      </div>
      <button class="btn-remove" data-idx="${idx}">×</button>
    </div>`).join('');

  // 合計
  const total=cart.reduce((s,i)=>s+(Number(i.price)||0)*i.qty,0);
  document.getElementById('cart-total').textContent=fmt(total);

  // イベント
  area.querySelectorAll('.qty-minus').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cart=loadCart();const i=Number(btn.dataset.idx);
      if(cart[i].qty>1){cart[i].qty--;saveCart(cart);renderCart();}
    });
  });
  area.querySelectorAll('.qty-plus').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cart=loadCart();const i=Number(btn.dataset.idx);
      cart[i].qty++;saveCart(cart);renderCart();
    });
  });
  area.querySelectorAll('.qty-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const cart=loadCart();const i=Number(inp.dataset.idx);
      const v=Math.max(1,parseInt(inp.value)||1);
      cart[i].qty=v;saveCart(cart);renderCart();
    });
  });
  area.querySelectorAll('.btn-remove').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cart=loadCart();cart.splice(Number(btn.dataset.idx),1);saveCart(cart);renderCart();
      renderProducts(currentTab==='frequent'?[]:allProducts); // ボタン状態更新
    });
  });
}

// ── 注文送信 ─────────────────────────────────────────────────
document.getElementById('submit-btn').addEventListener('click',async()=>{
  const cart=loadCart();
  if(!cart.length){showToast('カートが空です','error');return;}
  const note=document.getElementById('order-note').value.trim();

  // ── 注文確認画面を表示 ──────────────────────────────────────
  const confirmed = await showOrderConfirm(cart, note);
  if(!confirmed) return;

  const btn=document.getElementById('submit-btn');
  btn.textContent='送信中…';btn.disabled=true;

  try{
    const res=await gasGet({action:'submitOrder',token:session.token,items:JSON.stringify(cart),note});
    if(!res.ok){showToast('送信失敗: '+res.error,'error');return;}
    clearCart();
    renderCart();
    renderProducts(allProducts);
    document.getElementById('order-note').value='';
    // 送信完了メッセージ
    showOrderComplete(res.data.orderId, cart);
  }catch(e){
    showToast('通信エラーが発生しました','error');
  }finally{
    btn.textContent='📤 注文を送信する';btn.disabled=loadCart().length===0;
  }
});

// ── 注文確認モーダル ─────────────────────────────────────────
function showOrderConfirm(cart, note) {
  return new Promise(resolve => {
    const total = cart.reduce((s,i)=>s+(Number(i.price)||0)*i.qty, 0);
    const rows  = cart.map((item,i) => `
      <tr style="${i%2?'background:#f8fafc':''}">
        <td style="padding:8px 10px">${escHtml(item.name)}${item.model?'<br><span style="font-size:11px;color:#5a6a7a">'+escHtml(item.model)+'</span>':''}</td>
        <td style="padding:8px 10px;text-align:center">${item.qty} ${escHtml(item.unit||'')}</td>
        <td style="padding:8px 10px;text-align:right;white-space:nowrap">${item.price?fmt(Number(item.price)*item.qty):'-'}</td>
        <td style="padding:8px 10px;font-size:12px;color:#5a6a7a">${escHtml(item.vendor||'-')}</td>
      </tr>`).join('');

    const overlay = document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px';
    overlay.innerHTML=`
      <div style="background:#fff;border-radius:14px;padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.25)">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:4px">📋 注文内容の確認</h2>
        <p style="font-size:13px;color:#5a6a7a;margin-bottom:16px">以下の内容で注文します。内容をご確認ください。</p>
        <div style="overflow-x:auto;border-radius:8px;border:1.5px solid #d4dce6;margin-bottom:14px">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="background:#f0f4f8">
                <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #d4dce6">品名</th>
                <th style="padding:8px 10px;text-align:center;border-bottom:2px solid #d4dce6;white-space:nowrap">数量</th>
                <th style="padding:8px 10px;text-align:right;border-bottom:2px solid #d4dce6;white-space:nowrap">小計</th>
                <th style="padding:8px 10px;text-align:left;border-bottom:2px solid #d4dce6;white-space:nowrap">注文先</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
            <tfoot>
              <tr style="background:#e8f5ed">
                <td colspan="2" style="padding:10px;font-weight:700;font-size:13px">合計金額（参考・税込）</td>
                <td style="padding:10px;text-align:right;font-weight:700;font-size:16px;color:#1a6e3c;white-space:nowrap">${fmt(total)}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        ${note?`<div style="background:#fffdf0;border:1.5px solid #f0e8a0;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px"><strong>備考：</strong>${escHtml(note)}</div>`:''}
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button id="conf-cancel" style="padding:11px 20px;background:#fff;border:2px solid #d4dce6;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit">キャンセル</button>
          <button id="conf-ok" style="padding:11px 24px;background:#1a6e3c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✅ この内容で注文する</button>
        </div>
      </div>`;

    document.getElementById('conf-ok',   overlay)?.addEventListener('click', ()=>{ overlay.remove(); resolve(true);  });
    document.getElementById('conf-cancel',overlay)?.addEventListener('click',()=>{ overlay.remove(); resolve(false); });
    overlay.querySelector('#conf-ok').addEventListener('click',    ()=>{ overlay.remove(); resolve(true);  });
    overlay.querySelector('#conf-cancel').addEventListener('click', ()=>{ overlay.remove(); resolve(false); });
    overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.remove(); resolve(false); }});
    document.body.appendChild(overlay);
  });
}

// ── 注文完了メッセージ ────────────────────────────────────────
function showOrderComplete(orderId, cart) {
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:14px;padding:36px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.25)">
      <div style="font-size:56px;margin-bottom:12px">✅</div>
      <h2 style="font-size:20px;font-weight:700;color:#1a6e3c;margin-bottom:8px">注文を送信しました</h2>
      <p style="font-size:13px;color:#5a6a7a;margin-bottom:6px">総務課へ通知メールが送信されました。</p>
      <p style="font-family:monospace;background:#f0f4f8;padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;margin:12px 0">注文ID：${escHtml(orderId)}</p>
      <p style="font-size:12px;color:#5a6a7a;margin-bottom:20px">${cart.length}点の商品を注文しました</p>
      <button id="complete-close" style="padding:12px 28px;background:#1a6e3c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">閉じる</button>
    </div>`;
  overlay.querySelector('#complete-close').addEventListener('click', ()=> overlay.remove());
  document.body.appendChild(overlay);
}

// カートクリア
document.getElementById('clear-btn').addEventListener('click',()=>{
  if(!confirm('カートをクリアしますか？'))return;
  clearCart();renderCart();renderProducts(allProducts);
});

// カートパネルへスクロール
document.getElementById('cart-scroll-btn').addEventListener('click',()=>{
  document.getElementById('cart-panel').scrollIntoView({behavior:'smooth'});
});

// ── 初期化 ───────────────────────────────────────────────────
fetchProducts();
renderCart();
</script>
