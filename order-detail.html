<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注文処理ページ | 物品管理システム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --primary:#0d7a6b; --primary-lt:#e6f4f2; --primary-dk:#095c51;
  --accent:#f0a500; --danger:#e03e3e;
  --bg:#f5f7fa; --card:#fff; --border:#dde3eb;
  --text:#1a2233; --muted:#6b7a93;
  --shadow:0 2px 12px rgba(0,0,0,.07); --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ---- ヘッダー ---- */
.header{background:var(--primary);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-title{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600}
.header-right{display:flex;align-items:center;gap:10px}
.btn-hdr{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn-hdr:hover{background:rgba(255,255,255,.25)}

/* ---- 2カラムレイアウト ---- */
.layout{display:grid;grid-template-columns:280px 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:20px 16px 80px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* ---- 左：注文リスト ---- */
.order-list-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;position:sticky;top:72px}
.order-list-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.order-list-title{font-size:13px;font-weight:700;color:var(--primary)}
.show-done-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit}
.show-done-toggle input{cursor:pointer}
.order-list-search{padding:10px 12px;border-bottom:1px solid var(--border)}
.order-list-search input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;transition:border-color .2s}
.order-list-search input:focus{outline:none;border-color:var(--primary)}
.order-list-items{max-height:calc(100vh - 240px);overflow-y:auto}

.order-list-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative}
.order-list-item:hover{background:var(--primary-lt)}
.order-list-item.active{background:var(--primary-lt);border-left:3px solid var(--primary)}
.oli-id{font-size:11px;font-family:'DM Sans',sans-serif;color:var(--muted)}
.oli-dept{font-size:13px;font-weight:700;margin:2px 0}
.oli-meta{font-size:11px;color:var(--muted)}
.oli-badge{position:absolute;top:12px;right:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px}
.badge-new{background:#fff3cd;color:#856404}
.badge-ordered{background:var(--primary-lt);color:var(--primary-dk)}
.badge-done{background:#e6f4ec;color:#1a7a3a}

/* ---- 右：帳票 ---- */
.slip-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:28px}
.no-order{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

/* 帳票ヘッダー */
.slip-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.slip-head-left h2{font-size:22px;font-weight:700;font-family:'DM Sans',sans-serif;color:var(--text)}
.slip-head-left .slip-id{font-size:12px;font-family:'DM Sans',sans-serif;color:var(--muted);margin-top:4px}
.slip-head-right{text-align:right;font-size:13px;color:var(--muted);line-height:1.8}
.slip-head-right strong{color:var(--text);font-size:15px}
.slip-status-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-top:6px}
.s-new    {background:#fff3cd;color:#856404}
.s-ordered{background:var(--primary-lt);color:var(--primary-dk)}
.s-done   {background:#e6f4ec;color:#1a7a3a}

/* アクションバー */
.action-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--bg);border-radius:8px;border:1.5px solid var(--border);margin-bottom:20px}
.action-bar-label{font-size:12px;font-weight:700;color:var(--muted)}
.action-sep{width:1px;height:22px;background:var(--border)}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dk)}
.btn-warning{background:#e67e22;color:#fff}.btn-warning:hover{background:#ca6f1e}
.btn-done{background:var(--muted);color:#fff}.btn-done:hover{background:#44535f}
.btn-print{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}.btn-print:hover{background:var(--primary-lt)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 備考 */
.slip-note{background:#fffdf0;border:1.5px solid #f0e8a0;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:20px}
.slip-note-label{font-size:11px;font-weight:700;color:#b8860b;margin-bottom:4px}

/* テーブル */
.tbl-wrap{overflow-x:auto;margin-bottom:20px}
.slip-table{width:100%;border-collapse:collapse;font-size:13px}
.slip-table thead th{background:var(--bg);padding:9px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
.slip-table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.slip-table tbody tr:hover td{background:#f8fafc}
.slip-table tfoot td{padding:10px 12px;border-top:2px solid var(--border);font-weight:700;background:var(--bg)}
.row-status-sel{padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;background:#fff}
.row-status-sel:focus{outline:none;border-color:var(--primary)}

/* 印刷フッター */
.slip-foot{display:flex;gap:10px;justify-content:flex-end;padding-top:16px;border-top:1.5px solid var(--border)}

/* ローディング */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* トースト */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--text);color:#fff;border-radius:8px;padding:11px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:toastIn .25s ease;min-width:220px}
.toast.success{background:var(--primary)}.toast.error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---- 印刷スタイル ---- */
@media print {
  @page{size:A4 landscape;margin:12mm}
  .header,.order-list-card,.action-bar,.slip-foot,.btn,.row-status-sel,.toast-wrap{display:none!important}
  .layout{display:block!important;padding:0!important}
  .slip-card{box-shadow:none!important;border:none!important;padding:0!important}
  body,html{background:#fff!important}
  .slip-table{font-size:11px}
  .slip-table thead th,.slip-table tbody td,.slip-table tfoot td{padding:6px 8px}
}
</style>
</head>
<body>

<!-- ヘッダー -->
<header class="header">
  <div class="header-title">📄 注文処理ページ</div>
  <div class="header-right">
    <button class="btn-hdr" onclick="reloadAll()">🔄 更新</button>
    <button class="btn-hdr" onclick="window.print()">🖨 印刷</button>
    <a class="btn-hdr" href="admin.html">← 管理サイト</a>
  </div>
</header>

<!-- 2カラムレイアウト -->
<div class="layout">

  <!-- 左：注文リスト -->
  <div class="order-list-card">
    <div class="order-list-head">
      <span class="order-list-title">注文一覧</span>
      <label class="show-done-toggle">
        <input type="checkbox" id="show-done-chk" onchange="toggleShowDone()"> 払い出し済
      </label>
    </div>
    <div class="order-list-search">
      <input type="text" id="list-search" placeholder="部署名・注文IDで絞り込み" oninput="renderList()">
    </div>
    <div class="order-list-items" id="order-list-items">
      <div style="text-align:center;padding:24px;color:var(--muted);font-size:13px"><span class="spinner"></span> 読み込み中...</div>
    </div>
  </div>

  <!-- 右：帳票 -->
  <div class="slip-card" id="slip-card">
    <div class="no-order" id="no-order">← 左のリストから注文を選択してください</div>
    <div id="slip-area" style="display:none"></div>
  </div>

</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ============================================================
//  設定 ★要変更
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoRS-BS7B8ed2I9fOykpogsPhNvkmCDLnb5p4_VWjBC7qhTx0WMdzNhX6WXucVEA5j/exec';

// ============================================================
//  JSONP通信
// ============================================================
function gasGet(params) {
  return new Promise((resolve, reject) => {
    const cbName = '_gasCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const qs = Object.entries({ ...params, callback: cbName })
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v ?? ''))
      .join('&');
    const script = document.createElement('script');
    const timer  = setTimeout(() => { cleanup(); reject(new Error('タイムアウト')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.src    = GAS_URL + '?' + qs;
    script.onerror= () => { cleanup(); reject(new Error('接続エラー')); };
    document.head.appendChild(script);
  });
}

// ============================================================
//  認証チェック・ワンタイムトークン自動ログイン
//
//  通常アクセス: sessionStorage の hms_session を確認
//  メールリンク: URL に ?ott=<token> が付いていれば自動ログイン
// ============================================================
function getSession() { try { return JSON.parse(sessionStorage.getItem('hms_session') || 'null'); } catch { return null; } }
function setSession(s) { sessionStorage.setItem('hms_session', JSON.stringify(s)); }

const urlParams    = new URLSearchParams(location.search);
const ottParam     = urlParams.get('ott')     || '';
const initOrderId  = urlParams.get('orderId') || '';

// ワンタイムトークンがある場合は自動ログインを試みる
// （非同期のため DOMContentLoaded 前に開始し、完了後に初期化する）
let session = getSession();
let _initResolve;
const _initPromise = new Promise(r => { _initResolve = r; });

// セッションのトークンを取得（ワンタイムトークン自動ログイン後も対応）
function getToken() { return session ? session.token : ''; }

if (ottParam) {
  // ott がある → トークンを検証して自動ログイン
  (async () => {
    try {
      const res = await gasGet({ action: 'redeemOneTimeToken', ott: ottParam });
      if (res.ok) {
        setSession(res.data);
        session = res.data;
        // URL から ott を除去（ブラウザ履歴・リロードに残さない）
        const cleanUrl = location.pathname + (res.data.orderId ? '?orderId=' + encodeURIComponent(res.data.orderId) : '');
        history.replaceState(null, '', cleanUrl);
      } else {
        showToast('リンクの有効期限が切れています。管理サイトからログインしてください。', 'error');
        setTimeout(() => { location.href = 'portal.html'; }, 3000);
        return;
      }
    } catch(e) {
      showToast('自動ログインに失敗しました: ' + e.message, 'error');
      setTimeout(() => { location.href = 'portal.html'; }, 3000);
      return;
    }
    _initResolve();
  })();
} else if (!session || session.role !== 'admin') {
  // ott も有効セッションもない → ポータルへ
  alert('このページは総務課のみアクセスできます。');
  location.href = 'portal.html';
  _initResolve();
} else {
  _initResolve();
}
let allOrders       = [];   // 注文IDでグループ化したオブジェクト配列
let currentOrderId  = '';
let showDone        = false;

// ============================================================
//  初期化（ワンタイムトークン処理完了後に実行）
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  // ott がある場合は自動ログイン完了まで待つ
  await _initPromise;
  if (!session) return; // 自動ログイン失敗時はリダイレクト済み
  loadOrderList();
});

async function loadOrderList() {
  try {
    const res = await gasGet({ action: 'getAllOrders', token: getToken(), includeComplete: showDone ? 'true' : 'false' });
    if (!res.ok) throw new Error(res.error);

    // 注文ID単位でグループ化
    const byId = {};
    (res.data || []).forEach(o => {
      if (!byId[o.orderId]) byId[o.orderId] = {
        orderId: o.orderId, orderedAt: o.orderedAt,
        deptName: o.deptName, deptId: o.deptId,
        status: o.status, items: []
      };
      byId[o.orderId].items.push(o);
    });
    allOrders = Object.values(byId).sort((a, b) => b.orderedAt.localeCompare(a.orderedAt));
    renderList();

    // URLパラメータで指定された注文を自動選択
    if (initOrderId && !currentOrderId) {
      const found = allOrders.find(o => o.orderId === initOrderId);
      if (found) selectOrder(found.orderId);
    }
  } catch(e) {
    document.getElementById('order-list-items').innerHTML =
      `<div style="text-align:center;padding:24px;color:var(--danger);font-size:13px">❌ ${esc(e.message)}</div>`;
  }
}

function toggleShowDone() {
  showDone = document.getElementById('show-done-chk').checked;
  loadOrderList();
}

async function reloadAll() {
  await loadOrderList();
  if (currentOrderId) await selectOrder(currentOrderId);
  showToast('更新しました');
}

// ============================================================
//  注文リスト描画
// ============================================================
function renderList() {
  const kw  = document.getElementById('list-search').value.trim().toLowerCase();
  const el  = document.getElementById('order-list-items');
  const filtered = allOrders.filter(o =>
    !kw || o.deptName.toLowerCase().includes(kw) || o.orderId.toLowerCase().includes(kw)
  );
  if (!filtered.length) {
    el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">注文がありません</div>';
    return;
  }
  el.innerHTML = filtered.map(o => {
    const bCls = o.status === '払い出し済' ? 'badge-done' : o.status === '発注済' ? 'badge-ordered' : 'badge-new';
    return `<div class="order-list-item${o.orderId === currentOrderId ? ' active' : ''}" data-id="${esc(o.orderId)}" onclick="selectOrder('${esc(o.orderId)}')">
      <div class="oli-id">${esc(o.orderId)}</div>
      <div class="oli-dept">${esc(o.deptName)}</div>
      <div class="oli-meta">${esc((o.orderedAt||'').slice(0,10))} / ${o.items.length}品目</div>
      <span class="oli-badge"><span class="badge ${bCls}" style="font-size:10px;padding:2px 7px">${esc(o.status)}</span></span>
    </div>`;
  }).join('');
}

// ============================================================
//  注文選択・帳票描画
// ============================================================
async function selectOrder(orderId) {
  currentOrderId = orderId;
  renderList(); // アクティブ更新

  const res = await gasGet({ action: 'getOrderDetail', token: getToken(), orderId });
  if (!res.ok) { showToast('詳細の取得に失敗しました', 'error'); return; }
  renderSlip(res.data);
}

function renderSlip(order) {
  document.getElementById('no-order').style.display  = 'none';
  const area = document.getElementById('slip-area');
  area.style.display = 'block';

  const stCls = s => s === '払い出し済' ? 's-done' : s === '発注済' ? 's-ordered' : 's-new';
  const total  = (order.items || []).reduce((s, i) => s + (Number(i.price) || 0) * i.qty, 0);

  area.innerHTML = `
    <!-- 帳票ヘッダー -->
    <div class="slip-head">
      <div class="slip-head-left">
        <h2>物品請求伝票</h2>
        <div class="slip-id">${esc(order.orderId)}</div>
      </div>
      <div class="slip-head-right">
        <div>部署：<strong>${esc(order.deptName)}</strong></div>
        <div>注文日時：${esc((order.orderedAt||'').slice(0,16))}</div>
        <div><span class="slip-status-badge ${stCls(order.status)}">${esc(order.status)}</span></div>
      </div>
    </div>

    <!-- アクションバー（一括変更） -->
    <div class="action-bar">
      <span class="action-bar-label">注文全体を一括変更：</span>
      <button class="btn btn-warning btn-sm" onclick="bulkChange('${esc(order.orderId)}','発注済')">📦 発注済にする</button>
      <button class="btn btn-done btn-sm"    onclick="bulkChange('${esc(order.orderId)}','払い出し済')">✅ 払い出し済にする</button>
      <div class="action-sep"></div>
      <span style="font-size:12px;color:var(--muted)">行単位で変更する場合は下のセレクトを使用</span>
    </div>

    <!-- 備考 -->
    ${order.items[0]?.note
      ? `<div class="slip-note"><div class="slip-note-label">📝 備考・依頼事項</div>${esc(order.items[0].note)}</div>`
      : ''}

    <!-- 商品テーブル -->
    <div class="tbl-wrap">
      <table class="slip-table">
        <thead>
          <tr>
            <th>#</th><th>品名</th><th>型番</th><th>規格</th><th>単位</th>
            <th style="text-align:right">数量</th><th style="text-align:right">単価</th>
            <th style="text-align:right">小計</th><th>注文先</th><th>リンク</th><th>ステータス</th>
          </tr>
        </thead>
        <tbody>
          ${(order.items || []).map((item, i) => `
            <tr>
              <td style="color:var(--muted);text-align:center">${i + 1}</td>
              <td><strong>${esc(item.name)}</strong></td>
              <td style="font-size:12px;color:var(--muted)">${esc(item.model||'—')}</td>
              <td style="font-size:12px;color:var(--muted)">${esc(item.spec||'—')}</td>
              <td>${esc(item.unit||'—')}</td>
              <td style="text-align:right;font-weight:700">${item.qty}</td>
              <td style="text-align:right">${item.price ? '¥'+Number(item.price).toLocaleString() : '—'}</td>
              <td style="text-align:right;font-weight:700">${item.price ? '¥'+(Number(item.price)*item.qty).toLocaleString() : '—'}</td>
              <td style="font-size:12px;color:var(--muted)">${esc(item.vendor||'—')}</td>
              <td>${item.link1 ? `<a href="${esc(item.link1)}" target="_blank" style="font-size:11px;color:var(--primary);background:var(--primary-lt);padding:2px 7px;border-radius:4px;text-decoration:none">🔗</a>` : '—'}</td>
              <td>
                <select class="row-status-sel" data-code="${esc(item.code)}" onchange="changeRowStatus('${esc(order.orderId)}','${esc(item.code)}',this.value)">
                  ${['受付済','発注済','払い出し済'].map(s => `<option${s===item.status?' selected':''}>${s}</option>`).join('')}
                </select>
              </td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="7" style="text-align:right;font-size:13px">合計金額（参考・税込）</td>
            <td style="text-align:right;font-size:16px;color:var(--primary)">¥${total.toLocaleString()}</td>
            <td colspan="3"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- 印刷ボタン -->
    <div class="slip-foot">
      <button class="btn btn-print" onclick="window.print()">🖨 A4横で印刷</button>
    </div>`;
}

// ============================================================
//  ステータス変更
// ============================================================
async function changeRowStatus(orderId, code, newStatus) {
  try {
    const res = await gasGet({ action: 'updateOrderStatus', token: getToken(), orderId, status: newStatus, code });
    if (!res.ok) throw new Error(res.error);
    showToast(`${code} を「${newStatus}」に変更しました`, 'success');
    // リスト側の状態も更新
    const order = allOrders.find(o => o.orderId === orderId);
    if (order) { order.status = newStatus; order.items.forEach(i => { if (i.code === code) i.status = newStatus; }); renderList(); }
  } catch(e) { showToast('変更失敗: ' + e.message, 'error'); }
}

async function bulkChange(orderId, newStatus) {
  if (!confirm(`この注文の全商品を「${newStatus}」に変更しますか？`)) return;
  try {
    const res = await gasGet({ action: 'bulkUpdateStatus', token: getToken(), orderIds: JSON.stringify([orderId]), status: newStatus });
    if (!res.ok) throw new Error(res.error);
    showToast(`「${newStatus}」に変更しました`, 'success');
    await loadOrderList();
    await selectOrder(orderId);
  } catch(e) { showToast('変更失敗: ' + e.message, 'error'); }
}

// ============================================================
//  ユーティリティ
// ============================================================
function showToast(msg, type = '') {
  const wrap = document.getElementById('toast-wrap');
  const el   = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
