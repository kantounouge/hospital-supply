<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品管理システム｜ポータル</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4f8;--surface:#ffffff;--primary:#1a6e3c;--primary-light:#e8f5ed;
  --accent:#e05c2a;--text:#1a2533;--text-sub:#5a6a7a;--border:#d4dce6;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --radius:12px;--font-body:'Noto Sans JP',sans-serif;
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh}

/* ── ログイン ─────────────────────────────────────────────── */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:linear-gradient(135deg,#1a6e3c 0%,#2d9960 50%,#1a4a8a 100%);
  position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.login-card{
  background:rgba(255,255,255,.96);border-radius:20px;
  padding:40px 48px;width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.3);
  animation:slideUp .5s ease;position:relative;z-index:1;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .icon{font-size:48px;display:block;margin-bottom:8px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--primary);line-height:1.3}
.login-logo p{font-size:12px;color:var(--text-sub);margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:6px}
.form-group input{
  width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;
  font-size:15px;font-family:var(--font-body);transition:border-color .2s;
}
.form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,110,60,.12)}
.btn-login{
  width:100%;padding:14px;background:var(--primary);color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--font-body);transition:background .2s,transform .1s;margin-top:8px;
}
.btn-login:hover{background:#15592f}
.btn-login:active{transform:scale(.99)}
.login-error{
  background:#fff3f0;border:1px solid #f5c6c0;color:#c0392b;
  padding:10px 14px;border-radius:6px;font-size:13px;margin-top:12px;display:none;
}

/* ── ポータル ─────────────────────────────────────────────── */
#portal-screen{display:none}
.top-bar{
  background:var(--primary);color:#fff;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100;
}
.top-bar-left{display:flex;align-items:center;gap:12px}
.top-bar-left h1{font-size:16px;font-weight:700}
.top-bar-left .tag{background:rgba(255,255,255,.2);padding:2px 10px;border-radius:20px;font-size:12px}
.top-bar-right{display:flex;align-items:center;gap:12px}
.dept-label{font-size:13px;opacity:.9}
.btn-logout{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;
  font-family:var(--font-body);transition:background .2s;
}
.btn-logout:hover{background:rgba(255,255,255,.25)}
.portal-body{max-width:1100px;margin:0 auto;padding:24px 20px}
.section-title{font-size:13px;font-weight:600;color:var(--text-sub);letter-spacing:1px;margin-bottom:12px}

/* メニューカード */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:32px}
.menu-card{
  background:var(--surface);border-radius:var(--radius);padding:24px 20px;
  text-decoration:none;color:var(--text);
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  box-shadow:var(--shadow);border:1.5px solid var(--border);
  cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;
}
.menu-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.menu-card .card-icon{font-size:32px;line-height:1}
.menu-card .card-title{font-size:15px;font-weight:700}
.menu-card .card-desc{font-size:12px;color:var(--text-sub);line-height:1.5}
.menu-card.admin-card{border-color:var(--accent);background:linear-gradient(135deg,#fff5f2,#fff)}
.menu-card.admin-card:hover{box-shadow:0 8px 32px rgba(224,92,42,.15)}

/* ウィジェット */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 1fr}}
.widget-card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1.5px solid var(--border)}
.widget-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.widget-header h2{font-size:15px;font-weight:700}

/* お知らせ */
.notice-list{list-style:none}
.notice-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.notice-item:last-child{border-bottom:none}
.notice-dot{width:8px;height:8px;border-radius:50%;background:var(--text-sub);flex-shrink:0;margin-top:5px}
.notice-dot.important{background:var(--accent)}
.notice-date{font-size:11px;color:var(--text-sub);white-space:nowrap}
.notice-title{font-size:13px;font-weight:600;line-height:1.4;flex:1}
.notice-link{font-size:12px;color:var(--primary);text-decoration:none;display:block;margin-top:3px}
.notice-link:hover{text-decoration:underline}
.empty-msg{color:var(--text-sub);font-size:13px;text-align:center;padding:20px 0}

/* カレンダー */
.calendar-nav{display:flex;align-items:center;gap:8px}
.calendar-nav button{
  background:none;border:1.5px solid var(--border);border-radius:6px;
  width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--text);transition:background .2s;
}
.calendar-nav button:hover{background:var(--primary-light)}
.calendar-nav .month-label{font-size:14px;font-weight:700;min-width:80px;text-align:center}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.cal-head{font-size:11px;font-weight:700;text-align:center;color:var(--text-sub);padding:4px 0}
.cal-head:first-child{color:#e05c2a}
.cal-head:last-child{color:#2d6fa3}
.cal-cell{
  min-height:44px;border-radius:6px;padding:4px;
  font-size:12px;text-align:center;position:relative;transition:background .15s;
}
.cal-cell.other-month{color:var(--border)}
.cal-cell.today{background:var(--primary-light);font-weight:700;color:var(--primary)}
.cal-cell .date-num{display:block;font-size:12px;margin-bottom:2px}
.cal-cell .event-icons{font-size:11px;line-height:1.3}
.cal-cell.has-event{cursor:pointer}
.cal-cell.has-event:hover{background:var(--primary-light)}
.cal-tooltip{
  display:none;position:absolute;z-index:200;
  background:#1a2533;color:#fff;font-size:12px;padding:8px 12px;
  border-radius:6px;white-space:nowrap;min-width:160px;
  top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;
}
.cal-cell.has-event:hover .cal-tooltip{display:block}

/* スケルトン */
.skeleton{background:linear-gradient(90deg,#e8edf2 25%,#f0f4f8 50%,#e8edf2 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px;height:16px;margin:6px 0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:700px;width:100%;max-height:80vh;overflow-y:auto;position:relative;animation:slideUp .25s ease}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sub)}
.status-badge{padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600}
.s-new{background:#e8f5ed;color:#1a6e3c}.s-ordered{background:#fff8e1;color:#b8860b}.s-done{background:#e8edf2;color:#5a6a7a}

/* トースト */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:#1a2533;color:#fff;padding:12px 20px;border-radius:8px;
  font-size:14px;box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">🏥</span>
      <h1>院内物品管理システム</h1>
      <p>物品請求・発注・在庫管理ポータル</p>
    </div>
    <div class="form-group">
      <label>ログインID</label>
      <input type="text" id="login-id" placeholder="ログインIDを入力" autocomplete="username">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="パスワードを入力" autocomplete="current-password">
    </div>
    <button class="btn-login" id="login-btn">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ポータル画面 -->
<div id="portal-screen">
  <div class="top-bar">
    <div class="top-bar-left">
      <span>🏥</span>
      <h1>院内物品管理</h1>
      <span class="tag" id="role-tag">部署</span>
    </div>
    <div class="top-bar-right">
      <span class="dept-label" id="dept-label"></span>
      <button class="btn-logout" id="logout-btn">ログアウト</button>
    </div>
  </div>

  <div class="portal-body">
    <p class="section-title">メニュー</p>
    <div class="menu-grid" id="menu-grid"></div>

    <div class="two-col">
      <!-- お知らせ -->
      <div class="widget-card">
        <div class="widget-header"><h2>📢 お知らせ</h2></div>
        <ul class="notice-list" id="notice-list">
          <li class="notice-item"><div class="skeleton" style="width:100%"></div></li>
          <li class="notice-item"><div class="skeleton" style="width:80%"></div></li>
        </ul>
      </div>
      <!-- カレンダー -->
      <div class="widget-card">
        <div class="widget-header">
          <h2>📅 カレンダー</h2>
          <div class="calendar-nav">
            <button id="cal-prev">‹</button>
            <span class="month-label" id="cal-month-label"></span>
            <button id="cal-next">›</button>
          </div>
        </div>
        <div class="calendar-grid" id="cal-grid"></div>
      </div>
    </div>
  </div>
</div>

<!-- モーダル（汎用） -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" id="modal-close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
//  設定  ★デプロイ後に必ず変更
// ============================================================
const GAS_URL = 'YOUR_GAS_DEPLOY_URL_HERE';

// ============================================================
//  GAS通信ユーティリティ
//  GitHub Pages → GAS はリダイレクトが発生するため
//  redirect:'follow' を明示し、レスポンスを text で受けてから
//  JSON パースすることで「opaque レスポンス」問題を回避する
// ============================================================
async function gasGet(params) {
  const qs = Object.entries(params)
    .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v ?? ''))
    .join('&');
  const url = GAS_URL + '?' + qs;
  const res = await fetch(url, { redirect: 'follow' });
  const text = await res.text();
  // GAS が稀に HTML エラーページを返す場合の保護
  try {
    return JSON.parse(text);
  } catch {
    console.error('GASレスポンスのJSONパース失敗:', text.slice(0, 200));
    return { ok: false, error: 'サーバーエラー（JSONパース失敗）' };
  }
}

// ============================================================
//  セッション管理
// ============================================================
function getSession() {
  try { return JSON.parse(sessionStorage.getItem('hms_session') || 'null'); } catch { return null; }
}
function setSession(s) { sessionStorage.setItem('hms_session', JSON.stringify(s)); }
function clearSession() { sessionStorage.removeItem('hms_session'); }

function showToast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function autoLink(text) {
  return text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:#1a6e3c">$1</a>');
}

// ============================================================
//  ログイン
// ============================================================
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const loginId  = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl    = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!loginId || !password) {
    errEl.textContent = 'IDとパスワードを入力してください';
    errEl.style.display = 'block'; return;
  }
  const btn = document.getElementById('login-btn');
  btn.textContent = '認証中…'; btn.disabled = true;
  try {
    const res = await gasGet({ action: 'login', loginId, password });
    if (!res.ok) {
      errEl.textContent = res.error || 'ログイン失敗';
      errEl.style.display = 'block';
    } else {
      setSession(res.data);
      showPortal(res.data);
    }
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました';
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'ログイン'; btn.disabled = false;
  }
}

// ============================================================
//  ポータル表示
// ============================================================
function showPortal(session) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('portal-screen').style.display = 'block';
  document.getElementById('dept-label').textContent = session.deptName;
  document.getElementById('role-tag').textContent = session.role === 'admin' ? '総務課' : '部署';
  renderMenu(session);
  loadNotices(session);
  initCalendar();
}

function renderMenu(session) {
  const grid    = document.getElementById('menu-grid');
  const isAdmin = session.role === 'admin';
  const base = [
    { icon:'📋', title:'物品請求伝票',   desc:'物品の請求・注文を行います',   url:'order-form.html' },
    { icon:'🔍', title:'商品登録依頼',   desc:'新商品の登録を申請します',     url:'product-request.html' },
    { icon:'📦', title:'注文履歴',       desc:'過去の注文履歴を確認します',   action:'showOrders' },
    { icon:'📊', title:'棚卸しリスト',   desc:'棚卸し用CSVをダウンロード',    action:'downloadInventory' },
  ];
  const admin = [
    { icon:'⚙️', title:'管理者サイト',   desc:'注文管理・マスタ設定',         url:'admin.html',        cls:'admin-card' },
    { icon:'📄', title:'注文処理',       desc:'注文一覧・ステータス変更',     url:'order-detail.html', cls:'admin-card' },
  ];
  const menus = isAdmin ? [...base, ...admin] : base;
  grid.innerHTML = menus.map(m => `
    <div class="menu-card ${m.cls||''}" data-url="${m.url||''}" data-action="${m.action||''}">
      <span class="card-icon">${m.icon}</span>
      <span class="card-title">${m.title}</span>
      <span class="card-desc">${m.desc}</span>
    </div>`).join('');
  grid.querySelectorAll('.menu-card').forEach(card => {
    card.addEventListener('click', () => {
      const { url, action } = card.dataset;
      if (action === 'showOrders')       { showOrderHistory(); return; }
      if (action === 'downloadInventory'){ downloadInventory(); return; }
      if (url) window.location.href = url;
    });
  });
}

// ============================================================
//  お知らせ
//  ・認証不要で取得（token なし）
//  ・"[dept:DXXX]" タグを本文冒頭に含むものは該当部署のみ表示
// ============================================================
async function loadNotices(session) {
  const list = document.getElementById('notice-list');
  try {
    // ※ token なしで呼べるよう WebApp.gs の認証不要リストに入っている
    const res = await gasGet({ action: 'getNotices', activeOnly: 'true' });
    if (!res.ok || !res.data || !res.data.length) {
      list.innerHTML = '<li class="empty-msg">お知らせはありません</li>';
      return;
    }
    const deptId  = session ? session.deptId : '';
    const isAdmin = session ? session.role === 'admin' : false;

    // 部署限定フィルタ：[dept:DXXX] タグがある場合は該当部署と管理者のみ
    const visible = res.data.filter(n => {
      const m = n.body.match(/^\[dept:([^\]]+)\]/);
      if (!m) return true;          // タグなし → 全員に表示
      if (isAdmin) return true;     // 管理者は全件見える
      return m[1] === deptId;       // タグの部署IDと一致するものだけ
    });

    if (!visible.length) {
      list.innerHTML = '<li class="empty-msg">お知らせはありません</li>';
      return;
    }

    list.innerHTML = visible.map(n => {
      // 表示用に [dept:DXXX] タグを本文から除去
      const body = escHtml(n.body.replace(/^\[dept:[^\]]+\]\s*/, ''));
      return `
      <li class="notice-item">
        <span class="notice-dot ${n.priority === '重要' ? 'important' : ''}"></span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span class="notice-date">${escHtml(n.date)}</span>
            ${n.priority === '重要' ? '<span style="background:#fff0ef;color:#c0392b;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px">重要</span>' : ''}
          </div>
          <div class="notice-title">${escHtml(n.title)}</div>
          ${n.linkUrl ? `<a class="notice-link" href="${escHtml(n.linkUrl)}" target="_blank">${escHtml(n.linkLabel || n.linkUrl)}</a>` : ''}
          <p style="font-size:12px;color:#5a6a7a;margin-top:4px;line-height:1.6">${autoLink(body)}</p>
        </div>
      </li>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<li class="empty-msg">お知らせの読み込みに失敗しました</li>';
    console.error('loadNotices error:', e);
  }
}

// ============================================================
//  カレンダー
// ============================================================
let calYear, calMonth, calEvents = [];

function initCalendar() {
  const now = new Date();
  calYear   = now.getFullYear();
  calMonth  = now.getMonth() + 1;
  document.getElementById('cal-prev').addEventListener('click', () => {
    if (calMonth === 1) { calMonth = 12; calYear--; } else calMonth--;
    loadCalEvents();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    if (calMonth === 12) { calMonth = 1; calYear++; } else calMonth++;
    loadCalEvents();
  });
  loadCalEvents();
}

async function loadCalEvents() {
  renderCalendar([]); // ローディング中もグリッドを描画
  try {
    const res = await gasGet({ action: 'getCalendar', year: calYear, month: calMonth });
    calEvents = (res.ok && Array.isArray(res.data)) ? res.data : [];
  } catch (e) {
    calEvents = [];
    console.error('loadCalEvents error:', e);
  }
  renderCalendar(calEvents);
}

function renderCalendar(events) {
  document.getElementById('cal-month-label').textContent =
    `${calYear}/${String(calMonth).padStart(2, '0')}`;

  const grid    = document.getElementById('cal-grid');
  const days    = ['日','月','火','水','木','金','土'];
  const today   = new Date(); today.setHours(0, 0, 0, 0);
  const typeIcon= { deadline:'⚠️', delivery:'📦', other:'📅' };

  let html = days.map((d, i) =>
    `<div class="cal-head" style="${i===0?'color:#e05c2a':i===6?'color:#2d6fa3':''}">${d}</div>`
  ).join('');

  const firstDow = new Date(calYear, calMonth - 1, 1).getDay();
  const lastDay  = new Date(calYear, calMonth, 0).getDate();

  // 先月末尾の空白
  for (let i = 0; i < firstDow; i++) {
    html += '<div class="cal-cell other-month"></div>';
  }

  for (let d = 1; d <= lastDay; d++) {
    const dt      = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs     = events.filter(e => e.date === dt);
    const isToday = new Date(calYear, calMonth - 1, d).getTime() === today.getTime();
    const icons   = evs.map(e => typeIcon[e.type] || '📅').join('');
    const tip     = evs.map(e =>
      `${typeIcon[e.type]||'📅'} ${escHtml(e.title)}${e.note ? ' / ' + escHtml(e.note) : ''}`
    ).join('<br>');

    html += `<div class="cal-cell${isToday?' today':''}${evs.length?' has-event':''}">
      <span class="date-num">${d}</span>
      <span class="event-icons">${icons}</span>
      ${tip ? `<div class="cal-tooltip">${tip}</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

// ============================================================
//  注文履歴モーダル
// ============================================================
async function showOrderHistory() {
  const session = getSession();
  const res = await gasGet({ action: 'getMyOrders', token: session.token, includeComplete: 'true' });
  if (!res.ok) { showToast('履歴の取得に失敗しました'); return; }

  const byId = {};
  (res.data || []).forEach(o => {
    if (!byId[o.orderId]) byId[o.orderId] = [];
    byId[o.orderId].push(o);
  });

  const rows = Object.entries(byId).map(([id, items]) => `
    <tr>
      <td style="font-family:monospace;font-size:12px">${escHtml(id)}</td>
      <td style="white-space:nowrap">${escHtml(items[0].orderedAt?.slice(0,10)||'-')}</td>
      <td>${items.map(i => `${escHtml(i.name)} ×${i.qty}`).join('<br>')}</td>
      <td><span class="status-badge ${items[0].status==='払い出し済'?'s-done':items[0].status==='発注済'?'s-ordered':'s-new'}">${escHtml(items[0].status)}</span></td>
    </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:#999;padding:20px">注文履歴がありません</td></tr>';

  openModal(`<h2 style="margin-bottom:16px;font-size:17px">📦 注文履歴</h2>
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#f0f4f8">
        <th style="padding:8px;text-align:left;border-bottom:2px solid #d4dce6">注文ID</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid #d4dce6">日付</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid #d4dce6">内容</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid #d4dce6">状態</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`);
}

// ============================================================
//  棚卸しCSV
// ============================================================
async function downloadInventory() {
  const session = getSession();
  const res = await gasGet({
    action: 'exportInventoryCSV', token: session.token,
    type: 'dept', deptId: session.deptId, deptName: session.deptName,
  });
  if (!res.ok) { showToast('ダウンロード失敗'); return; }
  const blob = new Blob([res.data.csv], { type: 'text/csv;charset=utf-8' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `棚卸し_${session.deptName}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('棚卸しCSVをダウンロードしました');
}

// ============================================================
//  モーダル
// ============================================================
function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ============================================================
//  ログアウト
// ============================================================
document.getElementById('logout-btn').addEventListener('click', async () => {
  const session = getSession();
  if (session) await gasGet({ action: 'logout', token: session.token }).catch(() => {});
  clearSession();
  document.getElementById('portal-screen').style.display = 'none';
  document.getElementById('login-screen').style.display  = 'flex';
  document.getElementById('login-pass').value = '';
});

// ============================================================
//  初期化：セッション復元チェック
// ============================================================
(function init() {
  const session = getSession();
  if (session) showPortal(session);
})();
