<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品登録依頼</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f4f8;--surface:#fff;--primary:#1a6e3c;--primary-light:#e8f5ed;--accent:#e05c2a;--text:#1a2533;--text-sub:#5a6a7a;--border:#d4dce6;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:10px;--font:'Noto Sans JP',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.top-bar{background:var(--primary);color:#fff;padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-bar a{color:#fff;text-decoration:none;opacity:.8;font-size:13px}.top-bar a:hover{opacity:1}
.top-bar h1{font-size:15px;font-weight:700}
.page-body{max-width:820px;margin:0 auto;padding:24px 20px;display:grid;gap:20px}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1.5px solid var(--border)}
.card h2{font-size:16px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--text-sub);letter-spacing:.3px}
label .req{color:var(--accent);margin-left:2px}
input,textarea{padding:10px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:80px}

/* URLプレビュー */
.url-preview{
  margin-top:8px;background:#f8fafc;border:1.5px solid var(--border);
  border-radius:8px;padding:12px;display:none;
}
.url-preview img{width:64px;height:64px;object-fit:cover;border-radius:4px;margin-right:10px;float:left}
.url-preview-text{font-size:12px;color:var(--text-sub);overflow:hidden}
.url-preview-link{color:var(--primary);text-decoration:none;font-size:13px;font-weight:600;display:block;margin-bottom:4px;word-break:break-all}
.url-preview-link:hover{text-decoration:underline}

/* 受付IDバナー */
.req-id-banner{
  background:var(--primary-light);border:1.5px solid #a3d8b8;
  border-radius:8px;padding:14px 18px;display:none;
  align-items:center;justify-content:space-between;
}
.req-id-banner.show{display:flex}
.req-id-text{font-size:13px;color:var(--text-sub)}
.req-id-val{font-size:18px;font-weight:700;color:var(--primary);font-family:monospace}

.btn-submit{
  padding:13px 32px;background:var(--primary);color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--font);transition:background .2s;
}
.btn-submit:hover{background:#15592f}
.btn-submit:disabled{background:#aaa;cursor:not-allowed}
.btn-reset{padding:13px 20px;background:none;border:2px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;font-family:var(--font);color:var(--text-sub);transition:background .2s}
.btn-reset:hover{background:var(--bg)}

/* 依頼履歴 */
.history-table{width:100%;border-collapse:collapse;font-size:13px}
.history-table th{background:#f0f4f8;padding:8px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--text-sub);border-bottom:2px solid var(--border)}
.history-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.s-pending{background:#fff8e1;color:#b8860b}
.s-approved{background:var(--primary-light);color:var(--primary)}
.s-rejected{background:#fff0ef;color:#c0392b}
.empty-msg{text-align:center;color:var(--text-sub);padding:24px;font-size:13px}

#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:#1a2533;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:#1a6e3c}
#toast.error{background:#c0392b}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-bar">
  <a href="portal.html">← ポータル</a>
  <h1>🔍 商品登録依頼</h1>
</div>

<div class="page-body">

  <!-- 受付ID表示 -->
  <div class="req-id-banner" id="req-id-banner">
    <div>
      <div class="req-id-text">依頼を受け付けました。受付IDをお控えください。</div>
      <div class="req-id-val" id="req-id-display"></div>
    </div>
    <button onclick="document.getElementById('req-id-banner').classList.remove('show')" style="background:none;border:none;cursor:pointer;font-size:20px;color:#5a6a7a">×</button>
  </div>

  <!-- 依頼フォーム -->
  <div class="card">
    <h2>📝 登録依頼フォーム</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>商品名 <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="例：アルコール綿球 100個入" required>
      </div>
      <div class="form-group">
        <label>型番・規格</label>
        <input type="text" id="f-model" placeholder="例：ALC-100">
      </div>
      <div class="form-group full">
        <label>商品URL（参考リンク）</label>
        <input type="url" id="f-url" placeholder="https://...">
        <div class="url-preview" id="url-preview">
          <div class="url-preview-text">
            <a class="url-preview-link" id="url-preview-link" href="#" target="_blank">リンクを開く</a>
            <span id="url-preview-domain"></span>
          </div>
        </div>
      </div>
      <div class="form-group full">
        <label>備考・依頼理由</label>
        <textarea id="f-note" placeholder="使用目的・購入希望理由など"></textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn-submit" id="submit-btn">📤 依頼を送信する</button>
      <button class="btn-reset" id="reset-btn">リセット</button>
    </div>
  </div>

  <!-- 依頼履歴 -->
  <div class="card">
    <h2>📋 依頼履歴</h2>
    <table class="history-table">
      <thead>
        <tr>
          <th>受付ID</th><th>受付日</th><th>商品名</th><th>型番</th><th>ステータス</th><th>コメント</th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="6" class="empty-msg">読み込み中…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<div id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoRS-BS7B8ed2I9fOykpogsPhNvkmCDLnb5p4_VWjBC7qhTx0WMdzNhX6WXucVEA5j/exec'; // ★要変更

// GAS との通信は JSONP で行う（GitHub Pages → GAS の CORS 問題を回避）
// fetch は GAS が CORS ヘッダーを返せないためブラウザにブロックされる。
// JSONP は <script> タグを使うため CORS 制限を受けない。
function gasGet(params) {
  return new Promise((resolve, reject) => {
    const cbName = '_gasCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    const qs = Object.entries({ ...params, callback: cbName })
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v ?? ''))
      .join('&');
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('タイムアウト（GASに接続できませんでした）'));
    }, 20000);
    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.src = GAS_URL + '?' + qs;
    script.onerror = () => { cleanup(); reject(new Error('スクリプト読み込みエラー')); };
    document.head.appendChild(script);
  });
}
function getSession(){try{return JSON.parse(sessionStorage.getItem('hms_session')||'null');}catch{return null;}}
function showToast(msg,type='',dur=2800){
  const el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'');
  setTimeout(()=>el.className='',dur);
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const session=getSession();
if(!session)location.href='portal.html';

// URLプレビュー
document.getElementById('f-url').addEventListener('input', function(){
  const url=this.value.trim();
  const preview=document.getElementById('url-preview');
  if(!url||!url.startsWith('http')){preview.style.display='none';return;}
  try{
    const u=new URL(url);
    document.getElementById('url-preview-link').href=url;
    document.getElementById('url-preview-link').textContent=url.length>60?url.slice(0,60)+'…':url;
    document.getElementById('url-preview-domain').textContent=u.hostname;
    preview.style.display='block';
  }catch{preview.style.display='none';}
});

// 送信
document.getElementById('submit-btn').addEventListener('click', async()=>{
  const name=document.getElementById('f-name').value.trim();
  if(!name){showToast('商品名を入力してください','error');return;}
  const model=document.getElementById('f-model').value.trim();
  const url  =document.getElementById('f-url').value.trim();
  const note =document.getElementById('f-note').value.trim();

  const btn=document.getElementById('submit-btn');
  btn.textContent='送信中…';btn.disabled=true;

  try{
    const res=await gasGet({action:'submitProductRequest',token:session.token,name,model,url,note});
    if(!res.ok){showToast('送信失敗: '+res.error,'error');return;}
    const banner=document.getElementById('req-id-banner');
    document.getElementById('req-id-display').textContent=res.data.reqId;
    banner.classList.add('show');
    showToast('依頼を送信しました（'+res.data.reqId+'）','success',4000);
    // フォームリセット
    ['f-name','f-model','f-url','f-note'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('url-preview').style.display='none';
    loadHistory();
  }catch(e){showToast('通信エラーが発生しました','error');}
  finally{btn.textContent='📤 依頼を送信する';btn.disabled=false;}
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  ['f-name','f-model','f-url','f-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('url-preview').style.display='none';
});

// 依頼履歴
async function loadHistory(){
  const res=await gasGet({action:'getMyProductRequests',token:session.token});
  const tbody=document.getElementById('history-tbody');
  if(!res.ok||!res.data.length){
    tbody.innerHTML='<tr><td colspan="6" class="empty-msg">依頼履歴がありません</td></tr>';
    return;
  }
  const statusCls={受付中:'s-pending',承認:'s-approved',却下:'s-rejected'};
  tbody.innerHTML=res.data.slice().reverse().map(r=>`
    <tr>
      <td style="font-family:monospace;font-size:12px">${escHtml(r.reqId)}</td>
      <td style="white-space:nowrap">${escHtml(r.createdAt?.slice(0,10)||'-')}</td>
      <td>${escHtml(r.name)}</td>
      <td>${escHtml(r.model||'-')}</td>
      <td><span class="status-badge ${statusCls[r.status]||''}">${escHtml(r.status)}</span></td>
      <td style="font-size:12px;color:#5a6a7a">${escHtml(r.adminNote||'-')}</td>
    </tr>`).join('');
}

loadHistory();
</script>
</body>
</html>
